# --- MPU <-> MCU link -------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- Interactive shell on the same UART the MPU reads (lpuart1) -------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="unoq:~$ "

# Built-in command sets: poke hardware without rebuilding.
CONFIG_GPIO_SHELL=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y

# --- SMP / MCUmgr over the shell transport ----------------------------------
# One UART serves console + shell + SMP, so SMP is multiplexed over the shell
# rather than claiming its own port.
# MCUMGR_TRANSPORT_SHELL needs these two or it silently disables itself
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y

CONFIG_MAIN_STACK_SIZE=2048

# --- 8x13 LED matrix --------------------------------------------------------
# Charlieplexed on PF0..PF10, refreshed from a TIM17 counter callback at 100kHz.
# See mcu/app/src/matrix.c and boards/arduino_uno_q.overlay.
CONFIG_COUNTER=y

# --- Persistent storage in storage_partition (128K, previously unused) ------
# Holds one byte: the panel orientation set by `app matrix flip`.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- MCUboot: app becomes a signed image in slot0, updatable over SMP -------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
