# UNO Q on-board SWD, for `west flash -r openocd`.
#
# NOTE: this file is NOT upstream. It has to live inside the Zephyr checkout
# because Zephyr's openocd runner resolves board support in-tree and crashes
# without it (scripts/west_commands/runners/openocd.py:92 calls samefile on a
# missing dir). The canonical copy is ~/two-computers-one-board/mcu/board-support/support/ -
# re-copy it after a Zephyr version bump.
#
# The pin numbers deliberately are not repeated here. They live once, in
# openocd_gpiod.cfg, which tools/build-openocd.sh installs into /opt/openocd
# and which mcu/flash.sh also uses - so west and flash.sh cannot disagree about
# how this board is wired. add_script_search_dir first, because that file ends
# in `source [find stm32u5x.cfg]`.
add_script_search_dir /opt/openocd
source /opt/openocd/openocd_gpiod.cfg
