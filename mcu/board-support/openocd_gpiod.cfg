#
# OpenOCD adapter config for the UNO Q: the Linux MPU bit-bangs the MCU's SWD
# lines with libgpiod, so there is no external probe. Installed to
# /opt/openocd/openocd_gpiod.cfg by tools/build-openocd.sh, and named by
# mcu/flash.sh.
#
# The pin numbers are this project's own finding - they are not in the UNO Q
# datasheet or in Zephyr's board definition. See docs/hardware.md.

adapter driver linuxgpiod

adapter gpio srst 38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
adapter gpio trst 38 -chip 1

transport select swd
source [find stm32u5x.cfg]
