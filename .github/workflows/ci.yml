name: checks

# Runs the same gates as tools/check.sh, so a green CI means the same thing as
# a clean local run. Four jobs:
#
#   changes    seconds. Decides which of the expensive two below run at all.
#   checks     lint, format, types, tests, coverage, docs. Thirty seconds.
#   diagrams   opens a real browser on every page that has one. ~2 minutes.
#   firmware   compiles for the real Cortex-M33 and runs the MCU suites. ~5
#              minutes, because it needs a Zephyr workspace and the SDK.
#
# THE SHAPE HERE IS DELIBERATE. `checks` is the one that runs on everything, so
# it is kept to the gates that are fast and cannot hang. The two slow ones are
# each gated on `changes`, and both run in PARALLEL with `checks` rather than
# behind it - a documentation pull request should not wait on a Zephyr download
# to find out its links are fine.
#
# The cost of getting this wrong is not hypothetical: the browser gate was
# briefly inside `checks`, which took every pull request in the repository from
# thirty seconds to five and a half minutes, including ones that touched no
# documentation at all.
#
# The runner is x86_64 while the board is aarch64. That is fine for `checks`:
# gpiod ships manylinux wheels for both, and the tests use fakes rather than
# real hardware. It is also fine for `firmware`, which cross-compiles - the
# output is Cortex-M33 either way, and native_sim/native/64 is 64-bit on both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not @v9: astral-sh publish moving major tags only up
        # to v7, so `@v9` does not resolve and the whole workflow fails to
        # start. Bump this by hand - `latest release` and `latest major tag`
        # are different questions for this action.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dev tooling
        # Same script the board uses; it detects the runner's architecture.
        run: tools/install-dev-tools.sh

      - name: Run gates
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tools/check.sh python shell c docs

  # THE BROWSER GATE IS NOT HERE, AND THAT IS DELIBERATE.
  #
  # tools/check-diagrams.sh opens a real browser on every page that has a
  # diagram. It is the only thing that can prove one actually draws, it runs on
  # the board as part of `tools/check.sh`, and it passes there - 12 diagrams
  # across 11 pages, every time.
  #
  # On a GitHub runner it has never once worked. Three attempts:
  #
  #   1. hung, and took an unrelated pull request to the 15-minute job timeout
  #      with chrome still alive
  #   2. reported "0 of 1 drew" on all 11 pages of a build that renders
  #      perfectly here - a shared --user-data-dir serialising the launches
  #   3. chromium 150 never exits from --dump-dom at all. Killed by the
  #      per-page timeout, exit 124, with the fixture (200, 238 bytes) and the
  #      library (200, 3566058 bytes) both confirmed served. Nothing wrong
  #      with the site; --virtual-time-budget simply does not end the process.
  #
  # Three rounds, three infrastructure failures, zero true findings. A gate
  # with that record is not protecting the site, it is taxing every pull
  # request and training us to ignore a red tick.
  #
  # WHAT STILL GUARDS THE INVARIANT: `checks` above runs `diagram assets`,
  # which asserts in 0.26s and with no browser that the library is vendored
  # rather than fetched, that the theme bundle references it relatively, that
  # mermaid-init.js shipped, and that every page carrying a diagram loads it.
  # That is the entire regression class that has ever actually bitten us, and
  # it is checked on every pull request. What is left uncovered is narrow:
  # mermaid.run() throwing once called. The board checks that before each push.
  #
  # TO BRING IT BACK, one of:
  #   - pin chrome-headless-shell (the supported --dump-dom path) rather than
  #     using whatever chromium the runner image ships
  #   - drive one long-lived browser over the DevTools protocol instead of
  #     launching one per page, which also makes it ~10x faster
  # Tracked as an issue; do not re-add it by simply uncommenting a job.

  # Does this change touch anything the firmware is built from?
  #
  # Seconds, and it decides whether the five-minute job below runs at all. Most
  # pull requests here are documentation - the course alone is 6,000 lines - and
  # none of them can affect a Cortex-M33 binary.
  #
  # Asking the API for the changed files rather than using a paths-filter action
  # keeps this dependency-free, and rather than `git diff` because a shallow
  # clone does not have the base commit to diff against.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything that is not a pull request - a push to main, a manual run -
          # builds. The point is to skip work that cannot matter, not to find
          # excuses; main should always have a proven firmware build.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            echo "not a pull request - building"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')

          # west.yml and this workflow are in the list because both change what
          # gets built, without any C file moving.
          if grep -qE '^(mcu/|west\.yml|\.github/workflows/ci\.yml)' <<<"$files"; then
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            echo "firmware inputs changed - building"
          else
            echo "firmware=false" >>"$GITHUB_OUTPUT"
            echo "nothing under mcu/ changed - skipping the firmware build"
          fi


  # The MCU half. Split into its own job because it needs a Zephyr workspace and
  # the SDK, which the gates above do not - so a formatting mistake still fails
  # in thirty seconds rather than waiting on a toolchain download.
  #
  # This job exists because for a long time it did not: a change that broke the
  # firmware build got a green tick, because nothing outside the board ever
  # compiled it. The version it builds is held equal to the board's by
  # tools/check-zephyr-pin.sh.
  #
  # GATED TWICE, because it is the expensive one (~5 minutes, most of it
  # downloading Zephyr and the SDK):
  #
  #   needs: checks   do not spend five minutes finding out the code does not
  #                   lint. The fast gates take thirty seconds; if they fail,
  #                   this never starts.
  #   if: changes     skip entirely when nothing it builds from was touched.
  #
  # NOTE for branch protection: a skipped job reports as "skipped", not
  # "success". If this is ever made a required check, a documentation-only pull
  # request will sit unmergeable - require `checks` instead, or add a stub job
  # that always succeeds.
  firmware:
    needs: [checks, changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Checked out under a fixed name rather than the repository's, because
          # west.yml has to name this directory and the repository is going to
          # be renamed. See manifest.self.path.
          path: app

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Build the firmware for the real board
        # The thing that was missing. native_sim below exercises the logic; only
        # this proves the code still compiles for a Cortex-M33, links inside the
        # 416K slot, and signs for MCUboot.
        working-directory: app
        run: west build -b arduino_uno_q -d /tmp/build mcu/app

      - name: Sign for MCUboot, and check it still fits
        # Signing is a SEPARATE step from the build, here and in mcu/zbuild.sh:
        # `west build` does not do it. An unsigned image compiles perfectly and
        # MCUboot then refuses to boot it, so a job that only built would miss
        # that completely - the first version of this one did, and the assertion
        # below is what caught it.
        #
        # This is also the real size check. The build prints Zephyr's own memory
        # table against the 416K slot; imgtool is what fails when the image plus
        # its header and trailer no longer fit, which is the case that bricks a
        # board on the next update.
        #
        # Deliberately identical to what mcu/zbuild.sh does. The two being
        # separate copies is a known wart - see the issue on unifying them.
        working-directory: app
        run: |
          pip3 install --quiet imgtool
          # The build part of the version must be a NUMBER. `--version 0.0.0+ci`
          # was rejected outright: imgtool wants maj.min.rev+build, and west
          # passes its own `--version 0.0.0+0` first, so a second one that does
          # not parse loses the whole invocation. zbuild.sh uses an epoch here
          # for the same reason; the run number is the CI equivalent.
          west sign -t imgtool -d /tmp/build -- \
            --key "$(west topdir)/bootloader/mcuboot/root-rsa-2048.pem" \
            --version "0.0.0+${{ github.run_number }}"
          hex=/tmp/build/zephyr/zephyr.signed.hex
          [ -s "$hex" ] || { echo "west sign produced no $hex" >&2; exit 1; }
          echo "signed image: $(stat -c %s "$hex") bytes"

      - name: Run the MCU test suites
        # The same suites, on the same platform, as mcu/ztest.sh runs on the
        # board. native_sim/native/64 rather than plain native_sim: the latter
        # is a 32-bit target and fails on the board's aarch64 with a
        # CONFIG_64BIT error, so the board picked /native/64 and CI matches it
        # rather than testing a configuration nobody runs.
        working-directory: app
        run: |
          # `west topdir`, not $ZEPHYR_BASE: the setup action exports that only
          # within its own steps, so it is empty here and twister was looked for
          # at /scripts/twister. Asking west where the workspace is works from
          # any directory inside it.
          python3 "$(west topdir)/zephyr/scripts/twister" \
            -T mcu/tests \
            -p native_sim/native/64 \
            --outdir /tmp/twister-out \
            --clobber-output \
            -v
