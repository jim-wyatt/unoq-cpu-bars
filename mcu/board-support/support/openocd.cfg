# UNO Q on-board SWD: the Linux MPU bit-bangs the MCU's SWD lines via libgpiod.
# Absolute `source` so no -s search path is required.
#
# NOTE: this file is NOT upstream. It lives inside the Zephyr checkout because
# Zephyr's openocd runner resolves board support in-tree and crashes without it
# (scripts/west_commands/runners/openocd.py:92 calls samefile on a missing dir).
# A canonical copy is kept at ~/hybrid/mcu/board-support/support/openocd.cfg -
# re-copy it after a Zephyr version bump.
add_script_search_dir /opt/openocd

adapter driver linuxgpiod

adapter gpio srst  38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
adapter gpio trst  38 -chip 1

transport select swd
source /opt/openocd/stm32u5x.cfg
